[package]
name = "s32p-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mimalloc = { workspace = true }

# Local crates
s32p-directory = { path = "../s32p-directory" }
s32p-support = { path = "../s32p-support" }

# Pingora stack
pingora = { version = "0.8.0", features = ["proxy", "rustls"] }
rustls = { workspace = true }
bytes = { workspace = true }

# HTTP types
http = { workspace = true }
http-body-util = { workspace = true }

# Time and parsing
time = { workspace = true }

# Error handling, async traits
anyhow = { workspace = true }
async-trait = { workspace = true }

# CLI parsing
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# worker management
dashmap = "6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time", "net", "sync"] }
libc = { workspace = true }
tempfile = "3"

# responses and config
serde = { workspace = true }
serde_yaml = { workspace = true }
quick-xml = { workspace = true }
url = { workspace = true }

# session store
uuid = { workspace = true, features = ["v4"] }
rand = "0.8"
base64 = "0.22"
