[package]
name = "s3pm-support"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"

# authentication
aws-sigv4 = { version = "1.3", features = ["sign-http"] }
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.9"

constant_time_eq = "0.4"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }

# shared classifier parses query params
url = "2"

# shared S3 REST-XML builders
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.39", features = ["serialize"] }

# build ready-to-use http::Response bodies (works directly with hyper)
bytes = "1"
http = "1"
http-body-util = "0.1"
