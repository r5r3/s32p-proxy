[package]
name = "s32p-support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }

# authentication
aws-sigv4 = { version = "1.3", features = ["sign-http"] }
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.9"

constant_time_eq = "0.5"
time = { workspace = true }

# shared classifier parses query params
url = { workspace = true }
percent-encoding = "2"

# shared S3 REST-XML builders
serde = { workspace = true }
quick-xml = { workspace = true }

# for http response bodyies and parsing
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }

# for file system helpers
libc = { workspace = true }
