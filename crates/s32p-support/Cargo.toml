[package]
name = "s32p-support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"

# authentication
aws-sigv4 = { version = "1.3", features = ["sign-http"] }
aws-credential-types = "1.2"
aws-smithy-runtime-api = "1.9"

constant_time_eq = "0.4"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }

# shared classifier parses query params
url = "2"
percent-encoding = "2"

# shared S3 REST-XML builders
serde = { workspace = true }
quick-xml = { version = "0.39", features = ["serialize"] }

# for http response bodyies and parsing
bytes = "1"
http = "1"
http-body-util = "0.1"
httpdate = "1"

# for file system helpers
libc = "0.2"
