[package]
name = "s3pm-directory"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
libc = "0.2"

# OpenBao/Vault HTTP API (pure Rust TLS to avoid OpenSSL headaches)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

