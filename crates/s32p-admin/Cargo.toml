[package]
name = "s32p-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

# We'll use reqwest directly so we don't depend on undocumented/unstable higher-level helpers.
reqwest = { workspace = true }

uuid = { version = "1", features = ["v4"] }

tracing = "0.1"

s32p-directory = { path = "../s32p-directory" }
s32p-support = { path = "../s32p-support" }

