cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
  "crates/s32p-directory",
  "crates/s32p-proxy",
  "crates/s32p-support",
  "crates/s32p-admin",
  "crates/s32p-ctl",
  "crates/s32p-gateway",
  "crates/restricted-exec",
]

[workspace.package]
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
authors = ["Robert Redl"]
description = "S3 to POSIX proxy and gateway"

[workspace.dependencies]
rustls = { version = "0.23", features = ["aws_lc_rs", "read_buf"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time", "json"] }
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }

# Shared across multiple workspace crates. Features set per-crate via
# `{ workspace = true, features = [...] }` where they vary.
anyhow = "1"
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
httpdate = "1"
libc = "0.2"
mimalloc = "0.1.52"
quick-xml = { version = "0.40", features = ["serialize"] }
regex = "1.12.3"
tokio = { version = "1" }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"

[profile.perf]
rustflags = ["-C", "target-cpu=native"]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

