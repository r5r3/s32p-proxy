[package]
name = "s3-proxy-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pingora stack
pingora        = "0.6"
pingora-core   = "0.6"
pingora-http   = "0.6"

# HTTP types (align with Pingora's http 1.x)
http           = "1"

# SigV4 + AWS identity
aws-sigv4              = { version = "1.3", features = ["sign-http"] }
aws-credential-types   = "1.2"
aws-smithy-runtime-api = "1.9"

# Time and parsing
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }

# Error handling, async traits
anyhow      = "1"
async-trait = "0.1"

# Crypto helpers
hex              = "0.4"
constant_time_eq = "0.4"

# Logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["fmt", "env-filter"] }

# others
dashmap = "6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "sync"] }

