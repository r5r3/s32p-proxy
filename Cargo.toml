cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
  "crates/s3pm-directory",
  "crates/s3pm-proxy",
  "crates/s3pm-support",
  "crates/s3pm-admin",
  "crates/s3pm-ctl",
  "crates/s3pm-gateway",
]

[profile.perf]
rustflags = ["-C", "target-cpu=native"]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

