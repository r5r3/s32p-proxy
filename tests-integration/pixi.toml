[workspace]
authors = ["Robert Redl <robert.redl@lmu.de>"]
channels = ["conda-forge"]
name = "tests-integration"
platforms = ["linux-64"]
version = "0.1.0"
description = "Integration tests for s32p-proxy. Spawns the real proxy + workers and drives them through a matrix of S3 clients (boto3, aws-cli, mcli, ...)."

# Tasks. Run with `pixi run <name>`. The `--` separator forwards extra args to pytest.
# Examples:
#   pixi run test
#   pixi run test -k multipart
#   pixi run test --clients=boto3
#
# `build` shells out to cargo from the repo root (cwd=".."). The `test*` tasks
# depend on it so a fresh clone is one command from green. Cargo's no-op
# rebuild is fast enough that the always-on dependency isn't worth shaving.
[tasks]
build        = { cmd = "cargo build --bin s32p-proxy --bin s32p-gateway --bin s32p-ctl --bin restricted-exec", cwd = ".." }
test         = { cmd = "pytest", depends-on = ["build"] }
test-fast    = { cmd = "pytest -m 'not slow and not requires_lustre and not requires_openbao and not multi_uid_only'", depends-on = ["build"] }
test-multi-uid = { cmd = "pytest --mode=multi-uid", depends-on = ["build"] }
test-openbao = { cmd = "pytest -m requires_openbao", depends-on = ["build"] }
lint         = { cmd = "ruff check . && mypy s32p_test" }
format       = { cmd = "ruff format ." }

[dependencies]
python = ">=3.12"
pytest = ">=9.0.3,<10"
pytest-xdist = ">=3.8.0,<4"        # parallel test execution (-n auto)
pytest-timeout = ">=2.4.0,<3"       # per-test timeout, kills hung workers
boto3 = ">=1.43.7,<2"               # primary S3 SDK
pyyaml = ">=6.0.3,<7"               # build/edit directory.yaml
requests = ">=2.34.1,<3"            # raw HTTP for SigV4 / presign tests
awscli = ">=2.34.46,<3"             # backs the aws-cli client adapter
mountpoint-s3 = ">=1.21.0,<2"       # FUSE mount of an S3 bucket; directory-bucket-aware
rclone = ">=1.69,<2"                # FUSE mount of an S3 bucket via the generic S3 backend
restic = ">=0.18,<1"                # backup tool driven against the proxy's S3 backend

[feature.dev.dependencies]
ruff = "*"
mypy = "*"

[environments]
# `pixi run` defaults to the `default` env (test deps only); use
# `pixi shell -e dev` (or `pixi run -e dev <task>`) when you want lint/format tools.
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
