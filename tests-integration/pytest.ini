[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config --tb=short
timeout = 180
log_cli = false
log_cli_level = INFO

# Marker registry. Keep this in sync with s32p_test/markers.py if/when added.
markers =
    slow:                marks tests that take >5s; excluded from `pixi run test-fast`
    requires_lustre:     needs a Lustre mount + s32p-gateway built with --features lustre
    requires_openbao:    covers the OpenBao directory backend; auto-spawns a `bao server -dev` (needs the `bao` binary on PATH, else skips)
    requires_root:       needs to run as root (CAP_SETUID for restricted-exec --user)
    multi_uid_only:      only runs in --mode=multi-uid; needs two test uids
    single_uid_only:     only runs in --mode=single-uid (e.g. tests asserting same-uid behavior)
    requires_capability(cap): skip clients in the matrix that lack the named Capability
