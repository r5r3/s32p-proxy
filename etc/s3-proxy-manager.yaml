version: 1

server:
  listen: "0.0.0.0:9000"
  public_scheme: "http"
  region: "us-east-1"
  log: "info"

auth:
  backend: "openbao"
  yaml:
    path: "etc/directory.yaml"
  openbao:
    address: "http://127.0.0.1:5901"
    approle_mount: "approle"
    role_id_file: "etc/proxy-role-id-file"
    secret_id_file: "etc/proxy-secret-id-file"
    kv_mount: "secret"
    prefix: "s3pm"

workers:
  posix_root: "/tmp/s3"

  launcher:
    path: "../restricted-exec/target/debug/restricted-exec"
    pass_user_flag_if_root: true

  lifecycle:
    idle_timeout_secs: 600
    sweep_interval_secs: 10

  profiles:
    versitygw-default:
      exec: "../versity-patched/versitygw"
      args:
        - "--port"
        - "{{bind_addr}}"
        - "posix"
        - "--bucketlinks"
        - "{{posix_root}}"
      env:
        ROOT_ACCESS_KEY: "{{access_key}}"
        ROOT_SECRET_KEY: "{{secret_key}}"

    s3pm-gateway:
      exec: "target/debug/s3pm-gateway"
      args: []
      env:
        S3PM_BIND_ADDR: "{{bind_addr}}"
        S3PM_POSIX_ROOT: "{{posix_root}}"
        AWS_ACCESS_KEY_ID: "{{access_key}}"
        AWS_SECRET_ACCESS_KEY: "{{secret_key}}"
        S3PM_PUBLIC_SCHEME: "http"        # must match proxy's server.public_scheme
        S3PM_REGION: "{{region}}"
        S3PM_CHUNK_SIZE: "1048576"
        S3PM_INFLIGHT: "4"
        S3PM_DIRECT_IO: "true"

routing:
  class_map:
    multipart:
      action: "not_implemented"
      message: "multipart uploads are not implemented"
    versioning:
      action: "not_implemented"
      message: "versioning is not implemented"
    read:
      action: "proxy"
      worker_profile: "s3pm-gateway"
    other:
      action: "proxy"
      worker_profile: "versitygw-default"

