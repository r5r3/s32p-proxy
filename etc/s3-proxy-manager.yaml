version: 1

server:
  listen: "0.0.0.0:9000"
  public_scheme: "http"
  log: "info"

auth:
  backend: "openbao"
  yaml:
    path: "etc/directory.yaml"
  openbao:
    address: "http://127.0.0.1:5901"
    approle_mount: "approle"
    role_id_file: "etc/proxy-role-id-file"
    secret_id_file: "etc/proxy-secret-id-file"
    kv_mount: "secret"
    prefix: "s3pm"

workers:
  posix_root: "/tmp/s3"

  launcher:
    path: "../restricted-exec/target/debug/restricted-exec"
    pass_user_flag_if_root: true

  lifecycle:
    idle_timeout_secs: 600
    sweep_interval_secs: 10

  profiles:
    versitygw-default:
      exec: "../versity-patched/versitygw"
      args:
        - "--port"
        - "{{bind_addr}}"
        - "posix"
        - "--bucketlinks"
        - "{{posix_root}}"
      env:
        ROOT_ACCESS_KEY: "{{access_key}}"
        ROOT_SECRET_KEY: "{{secret_key}}"

routing:
  class_map:
    multipart:
      action: "not_implemented"
      message: "multipart uploads are not implemented"
    versioning:
      action: "not_implemented"
      message: "versioning is not implemented"
    other:
      action: "proxy"
      worker_profile: "versitygw-default"

