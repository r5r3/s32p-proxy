version: 1

server:
  listen: "0.0.0.0:9000"
  public_scheme: "http"
  tls_cert_path: "etc/fullchain.pem"
  tls_key_path: "etc/privkey.pem"
  region: "us-east-1"
  log_level: "s32p_proxy=debug,s32p_gateway=debug,pingora=info,pingora_proxy=info"
  # "text" (default, human-readable) or "json" (one JSON object per line,
  # for ingestion by Wazuh / Elastic / Loki / etc.).
  log_format: "text"
  virtual_hosted_suffixes:
    - 127.0.0.1.nip.io
    - localhost

  # Per-IP concurrency limit + keep-alive idle override for the public
  # listener. The keep-alive setting must be set explicitly — Pingora's
  # default is `Infinite` (no idle timeout at all), which lets an attacker
  # camp on an FD forever after a single completed request.
  connection_limits:
    # Reject with 429 SlowDown when one source IP has this many in-flight
    # requests. Typical S3 clients peak at 10-30 concurrent.
    max_concurrent_requests_per_ip: 256
    # Close keep-alive connections idle for longer than this. Matches
    # HAProxy / AWS ALB defaults (nginx ships 75s). Long-running uploads
    # and downloads are unaffected; the clock only runs between requests.
    keepalive_idle_secs: 60
    # Skip the per-IP cap for loopback peers (127.0.0.0/8, ::1) so operator
    # health checks and the integration test harness don't false-trip it.
    # Disable only if local users on the host are part of your threat model.
    trusted_loopback_bypass: true

auth:
  backend: "yaml"
  yaml:
    path: "etc/directory.yaml"
  openbao:
    address: "http://127.0.0.1:5901"
    approle_mount: "approle"
    role_id_file: "etc/proxy-role-id-file"
    secret_id_file: "etc/proxy-secret-id-file"
    # Admin AppRole — used by `s32p-ctl --config <this-file>` only; ignored by the proxy.
    admin_role_id_file: "etc/admin-role-id-file"
    admin_secret_id_file: "etc/admin-secret-id-file"
    kv_mount: "secret"
    prefix: "s32p"

workers:
  posix_root: "/tmp/s3"

  launcher:
    path: "{{install_bin_dir}}/restricted-exec"
    pass_user_flag_if_root: true
    landlock: true
    # Fail-closed if the kernel only partially enforces the Landlock ruleset.
    # Set to false only on hosts whose kernel lacks the full Landlock ABI
    # used by the launcher (defaults to true).
    landlock_strict: true

  lifecycle:
    idle_timeout_secs: 600
    sweep_interval_secs: 10

  profiles:
    versitygw-default:
      exec: "../versity-patched/versitygw"
      args:
        - "--port"
        - "{{bind_addr}}"
        - "posix"
        - "--bucketlinks"
        - "--nometa"
        - "{{posix_root}}"
      env:
        ROOT_ACCESS_KEY: "{{access_key}}"
        ROOT_SECRET_KEY: "{{secret_key}}"

    s32p-gateway:
      upstream:
        kind: "uds"
        uds_run_dir: "/run/user/10270/s32p"
      exec: "{{install_bin_dir}}/s32p-gateway"
      args: []
      env:
        S32P_BIND_UDS: "{{bind_uds}}"
        S32P_POSIX_ROOT: "{{posix_root}}"
        AWS_ACCESS_KEY_ID: "{{access_key}}"
        AWS_SECRET_ACCESS_KEY: "{{secret_key}}"
        S32P_PUBLIC_SCHEME: "http"        # must match proxy's server.public_scheme
        S32P_REGION: "{{region}}"
        S32P_VIRTUAL_HOSTED_SUFFIXES: "{{virtual_hosted_suffixes}}"
        S32P_CHUNK_SIZE_MB: "16"
        S32P_INFLIGHT: "32"
        S32P_POOL_SIZE: "128"
        S32P_DIRECT_IO: "true"
        S32P_LOG_LEVEL: "{{log_level}}"
        S32P_LOG_FORMAT: "{{log_format}}"

routing:
  class_map:
    # versioning + object_lock use the aws_compat target: per-op the
    # proxy returns the AWS feature-disabled shape (200 with empty
    # <VersioningConfiguration/> for GetBucketVersioning; 404 with
    # ObjectLockConfigurationNotFoundError for GetBucketObjectLockConfiguration;
    # 400 InvalidRequest for Put-Retention / Put-LegalHold). Ops within
    # the class that AWS always implements (e.g. PutBucketVersioning,
    # ListObjectVersions) fall back to 501 NotImplemented. Switch back
    # to `not_implemented` for a deployment that prefers a uniform "fail
    # loud" response on every op in the class.
    versioning:
      action: "aws_compat"
    object_lock:
      action: "aws_compat"
    multipart:
      action: "proxy"
      worker_profile: "s32p-gateway"
    read:
      action: "proxy"
      worker_profile: "s32p-gateway"
    write:
      action: "proxy"
      worker_profile: "s32p-gateway"
    bucket_admin:
      action: "not_implemented"
      message: "bucket administration is not implemented"
    session:
      action: "create_session"
    other:
      action: "proxy"
      worker_profile: "versitygw-default"

session:
  ttl_secs: 300
  cleanup_interval_secs: 60
  max_active: 10000

